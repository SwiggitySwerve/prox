worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  server {
    # Host networking reaches the existing proxies without changing their listeners.
    listen 127.0.0.1:18318;
    listen 10.42.0.1:18318;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_buffering off;

    # Authorization is supplied by the signed-in browser. No keys in this image.
    location ^~ /v8/management/prox/ {
      proxy_pass http://127.0.0.1:18319/v1/;
    }
    location ^~ /codex/v8/management/prox/ {
      proxy_pass http://127.0.0.1:18319/v1/;
    }
    location ^~ /claude/v8/management/prox/ {
      proxy_pass http://127.0.0.1:18319/v1/;
    }
    location ^~ /v8/management/ {
      proxy_pass http://127.0.0.1:8317;
    }
    location ^~ /codex/v8/management/ {
      proxy_pass http://127.0.0.1:8317/v8/management/;
    }
    location ^~ /claude/v8/management/ {
      proxy_pass http://127.0.0.1:8319/v8/management/;
    }
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    location = /management.html { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
