worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  server {
    # Host networking reaches the existing proxies without changing their listeners.
    listen 127.0.0.1:18318;
    listen 10.42.0.1:18318;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_buffering off;

    # Generated source routes preserve each caller's authorization header.
    include /etc/nginx/provider-routes.conf;
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    location = /management.html { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
  }
}
